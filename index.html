/* 版面：單一 16:9 畫布置中，遊戲畫面全部畫在 canvas 上；手機對 Bot 時畫布下方多一排觸控方向鍵 */
:root{
  --page:#2a2230; --panel:#fff8e8; --ink:#3f2631; --ink2:rgba(63,38,49,.75);
  --edge:#e6d6b8; --font:'Cubic11',"PingFang TC","Noto Sans TC",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--panel);font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:hidden}
#wrap{width:min(100%,calc((100vh - 16px) * 16 / 9));aspect-ratio:16/9;max-width:100%}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none;outline:none}
#pad{display:none;gap:8px}
#pad button{font:22px var(--font);min-width:56px;min-height:48px;background:var(--panel);color:var(--ink);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);border-radius:0;touch-action:manipulation}
#pad button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
#pad button:focus-visible{outline:3px solid #f2c14e}
@media (pointer:coarse){ body.botmode #pad{display:grid} }
#pad{grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,48px);gap:6px}
#padU{grid-area:1/2} #padL{grid-area:2/1} #padS{grid-area:2/2} #padR{grid-area:2/3} #padD{grid-area:3/2}
@media (pointer:coarse) and (orientation:landscape){ body.botmode{flex-direction:row} body.botmode #wrap{width:min(calc(100% - 200px),calc((100vh - 16px) * 16 / 9))} }
@media (pointer:coarse) and (orientation:portrait){ body.botmode #wrap{width:min(100%,calc((100vh - 190px) * 16 / 9))} }
</style>

// SIM-BEGIN
// 規則。這段不碰 DOM，Node 測試直接執行。
const N = 10, VIEW = 3, MAXSTEP = 50, LOCK_STAYS = 1;   // 在圖案格上停一次就選定
const REWARD = { success: 1, wrong: -1, timeout: -2 };
const DXY = [[0, 0], [0, -1], [0, 1], [-1, 0], [1, 0]];   // 0 停、1 上、2 下、3 左、4 右
const DIM = ['c', 's'];                                   // A 拿顏色、B 拿形狀

function mulberry32(seed) {
  let a = seed >>> 0;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const cheb = (p, q) => Math.max(Math.abs(p.x - q.x), Math.abs(p.y - q.y));
const manh = (p, q) => Math.abs(p.x - q.x) + Math.abs(p.y - q.y);
const same = (p, q) => p.x === q.x && p.y === q.y;
const patAt = (pats, p) => pats.findIndex(q => q.x === p.x && q.y === p.y);
const compOf = (pats, i) => pats.findIndex(q => q.c !== pats[i].c && q.s !== pats[i].s);

function newRound(rand, opt = {}) {
  const minStart = opt.minStartDist ?? 4;
  const taken = new Set(), key = p => p.y * N + p.x;
  const randCell = () => ({ x: Math.floor(rand() * N), y: Math.floor(rand() * N) });
  const combos = [[0, 0], [0, 1], [1, 0], [1, 1]];
  const pats = combos.map(([c, s]) => { let p; do p = randCell(); while (taken.has(key(p))); taken.add(key(p)); return { ...p, c, s }; });
  const ans = { c: rand() < 0.5 ? 0 : 1, s: rand() < 0.5 ? 0 : 1 };
  let A, B;
  do A = randCell(); while (taken.has(key(A)));
  do B = randCell(); while (taken.has(key(B)) || cheb(A, B) < minStart);
  const pl = p => ({ x: p.x, y: p.y, stays: 0, locked: false, lockPat: -1 });
  return { pats, ans, p: [pl(A), pl(B)], t: 0, done: false, outcome: null, log: [] };
}

const hintOf = (S, i) => S.ans[DIM[i]];
const ansIdx = S => S.pats.findIndex(q => q.c === S.ans.c && q.s === S.ans.s);
function isCorrectPair(S, i, j) {
  if (i < 0 || j < 0 || i === j) return false;
  const a = ansIdx(S);
  return (i === a && j === compOf(S.pats, a)) || (j === a && i === compOf(S.pats, a));
}

// 一步：兩人同時決定、一起結算；碰撞對稱擋回
function step(S, acts) {
  if (S.done) return;
  const P = S.p, eff = acts.map((a, i) => P[i].locked ? 0 : a);
  const cur = P.map(p => ({ x: p.x, y: p.y }));
  const tgt = eff.map((a, i) => {
    const x = cur[i].x + DXY[a][0], y = cur[i].y + DXY[a][1];
    return (x < 0 || y < 0 || x >= N || y >= N) ? { ...cur[i] } : { x, y };
  });
  let fin = tgt.map(t => ({ ...t }));
  if (same(tgt[0], tgt[1]) || (same(tgt[0], cur[1]) && same(tgt[1], cur[0]))) fin = cur.map(c => ({ ...c }));
  else for (let i = 0; i < 2; i++) { const j = 1 - i; if (same(tgt[i], cur[j]) && same(fin[j], cur[j])) fin[i] = { ...cur[i] }; }
  for (let i = 0; i < 2; i++) {
    const p = P[i];
    if (p.locked) continue;
    const onPat = patAt(S.pats, fin[i]);
